<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morris Pools Chat</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      background: #f2f7fa;
      font-size: 15px;
    }
    header {
      background: #0b6ea8;
      color: #fff;
      padding: 14px 16px 10px;
      flex-shrink: 0;
    }
    header h1 { margin: 0; font-size: 1rem; font-weight: 600; }
    header p { margin: 2px 0 0; font-size: 0.72rem; opacity: 0.85; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 85%;
      padding: 9px 13px;
      border-radius: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.bot { background: #fff; border: 1px solid #d7e3ea; align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg.user { background: #0b6ea8; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.typing { color: #5b7280; font-style: italic; }
    form {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      background: #fff;
      border-top: 1px solid #d7e3ea;
      flex-shrink: 0;
    }
    input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d7e3ea;
      border-radius: 999px;
      font-size: 15px;
      font-family: inherit;
    }
    input:focus { outline: 2px solid #0b6ea8; outline-offset: -1px; }
    button {
      background: #0b6ea8;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 0 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { background: #9db6c4; }
  </style>
</head>
<body>
  <header>
    <h1>Morris Pools</h1>
    <p>AI assistant — ask us anything about your pool</p>
  </header>
  <div id="messages"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Type your question…" autocomplete="off" maxlength="2000" />
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    var chatHistory = [];
    var messagesEl = document.getElementById("messages");
    var inputEl = document.getElementById("input");
    var sendEl = document.getElementById("send");

    function addBubble(role, text) {
      var div = document.createElement("div");
      div.className = "msg " + (role === "user" ? "user" : "bot");
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    addBubble(
      "bot",
      "Hi! I'm the Morris Pools assistant. Ask me about our services, or tell me what you need and I'll have the right person reach out."
    );

    document.getElementById("form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var text = inputEl.value.trim();
      if (!text || sendEl.disabled) return;
      inputEl.value = "";
      addBubble("user", text);
      chatHistory.push({ role: "user", content: text });

      sendEl.disabled = true;
      var typing = addBubble("bot", "…");
      typing.classList.add("typing");

      try {
        var res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: chatHistory.slice(-20) }),
        });
        var data = await res.json();
        typing.remove();
        var reply =
          (data && data.reply) ||
          "Sorry, something went wrong. Please email daniel@morrispools.com.";
        addBubble("bot", reply);
        chatHistory.push({ role: "assistant", content: reply });
      } catch (err) {
        typing.remove();
        addBubble("bot", "Sorry, I couldn't connect. Please try again in a moment.");
        chatHistory.pop();
      } finally {
        sendEl.disabled = false;
        inputEl.focus();
      }
    });
  </script>
</body>
</html>
